<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>《鹈鹕测试》——人类自古以来就痴迷于画鹈鹕骑自行车</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #0d0f14;
      color: #e0e4ee;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #stage-container {
      position: relative;
      width: 100vw;
      height: calc(100vh - 72px);
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    canvas {
      box-shadow: 0 12px 48px rgba(0,0,0,0.85);
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    #control-bar {
      width: 100vw;
      height: 72px;
      background: rgba(18, 22, 30, 0.95);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 16px;
      z-index: 100;
    }
    .btn {
      background: #252b38;
      color: #fff;
      border: 1px solid #3d4659;
      border-radius: 6px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover {
      background: #353e52;
      border-color: #55627d;
    }
    .btn-primary {
      background: #007acc;
      border-color: #1a8ad6;
    }
    .btn-primary:hover {
      background: #1188dc;
    }
    #progress-slider {
      flex: 1;
      height: 8px;
      -webkit-appearance: none;
      background: #2a3140;
      border-radius: 4px;
      outline: none;
      cursor: pointer;
    }
    #progress-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #00a2ff;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(0, 162, 255, 0.6);
    }
    .status-tag {
      font-size: 13px;
      color: #9aa5bc;
      white-space: nowrap;
      min-width: 180px;
    }
    select {
      background: #252b38;
      color: #e0e4ee;
      border: 1px solid #3d4659;
      border-radius: 6px;
      padding: 7px 12px;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }
  </style>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <script src="vendor/p5.min.js"></script>
  <script src="bundle.js?v=20261111_fix"></script>
</head>
<body>
  <div id="stage-container"></div>

  <div id="control-bar">
    <button id="btn-play" class="btn btn-primary">▶ 播放</button>
    <button id="btn-prev" class="btn">⏮ -0.5s</button>
    <button id="btn-next" class="btn">⏭ +0.5s</button>
    <input type="range" id="progress-slider" min="0" max="137" step="0.04" value="0">
    <span id="time-display" class="status-tag">00:00.0 / 02:17.0</span>
    <select id="scene-select">
      <option value="0">0. 开场 Intro (0s)</option>
    </select>
    <button id="btn-audio" class="btn">🔊 声音</button>
  </div>
</body>
</html>
